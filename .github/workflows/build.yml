name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            git \
            unzip \
            wget \
            curl \
            openjdk-11-jdk-headless \
            ca-certificates \
            libssl-dev \
            libffi-dev \
            zlib1g-dev \
            pkg-config \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsqlite3-dev \
            python3-dev \
            libc6-dev-i386 \
            libbz2-dev \
            libncurses5-dev \
            libgdbm-dev \
            libnss3-dev \
            libreadline-dev \
            liblzma-dev

          java -version

      - name: Ensure $HOME/.local/bin is on PATH (pip user installs)
        shell: bash
        run: |
          set -eux
          echo "Adding $HOME/.local/bin to PATH"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Android SDK cmdline-tools and SDK / NDK
        shell: bash
        run: |
          set -eux
          SDK_ROOT=${ANDROID_SDK_ROOT}
          sudo mkdir -p "${SDK_ROOT}"
          sudo chown -R "$USER":"$USER" "${SDK_ROOT}"
          mkdir -p "${SDK_ROOT}"

          cd /tmp

          # download stable command line tools (update URL only if Google changes it)
          CLI_ZIP="commandlinetools-linux-9477386_latest.zip"
          curl -fLO "https://dl.google.com/android/repository/${CLI_ZIP}"

          unzip -q "${CLI_ZIP}" -d "${SDK_ROOT}/cmdline-tools-temp"
          mkdir -p "${SDK_ROOT}/cmdline-tools/latest"
          mv "${SDK_ROOT}/cmdline-tools-temp/cmdline-tools/"* "${SDK_ROOT}/cmdline-tools/latest/"
          rm -rf "${SDK_ROOT}/cmdline-tools-temp" "${CLI_ZIP}"

          export PATH="${SDK_ROOT}/cmdline-tools/latest/bin:${PATH}"

          # Accept licenses and install platform tools, build-tools, platform, and NDK
          yes | sdkmanager --sdk_root="${SDK_ROOT}" --licenses
          sdkmanager --sdk_root="${SDK_ROOT}" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "cmdline-tools;latest" "ndk;27.3.13750724"

          echo "SDK directory listing:"
          ls -la "${SDK_ROOT}"
          echo "NDK listing:"
          ls -la "${SDK_ROOT}/ndk" || true

      - name: Show environment & debug info
        shell: bash
        run: |
          set -eux
          echo "PATH=$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NK_HOME"
          which java || true
          java -version || true
          which sdkmanager || true
          sdkmanager --list_installed || true
          ls -la $HOME/.local/bin || true

      - name: Install Python tools (buildozer, cython)
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip setuptools wheel
          # pin cython and buildozer to known-working versions
          python -m pip install --upgrade "cython==0.29.36" "buildozer==1.4.2"
          python -m pip show buildozer
          # ensure buildozer is runnable
          command -v buildozer || true

      - name: Extra debug - where is buildozer and python
        shell: bash
        run: |
          set -eux
          echo "Which buildozer:"
          which buildozer || echo "buildozer not in PATH"
          echo "pip show buildozer:"
          python -m pip show buildozer || true
          echo "Python site.USER_BASE/bin contents:"
          python -c "import site, os; print(site.USER_BASE); print(os.listdir(site.USER_BASE+'/bin') if os.path.isdir(site.USER_BASE+'/bin') else [])"

      - name: Build APK with Buildozer (capture verbose log)
        shell: bash
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
          JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
        run: |
          set -eux
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$HOME/.local/bin:$PATH"
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724

          buildozer --version
          # keep a verbose log so we can inspect it on failure
          buildozer android clean || true

          # run build and tee output to a log file we upload later
          buildozer -v android debug 2>&1 | tee buildozer-output.log

      - name: Upload logs and APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            buildozer-output.log
            bin/*.apk
            bin/*/*.apk