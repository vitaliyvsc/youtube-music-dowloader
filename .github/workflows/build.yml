name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      JAVA_HOME: /usr/lib/jvm/temurin-11-jdk-amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        shell: bash
        run: |
          set -eux
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            git \
            unzip \
            wget \
            curl \
            openjdk-11-jdk \
            libssl-dev \
            libffi-dev \
            zlib1g-dev \
            pkg-config \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libsqlite3-dev \
            python3-dev \
            libc6-dev-i386 \
            libbz2-dev \
            libncurses5-dev \
            libgdbm-dev \
            libnss3-dev \
            libreadline-dev \
            libffi-dev \
            liblzma-dev \
            libpq-dev \
            ca-certificates

          java -version

      - name: Install Android SDK + NDK
        shell: bash
        run: |
          set -eux

          sudo mkdir -p /usr/local/lib/android
          sudo chown -R "$USER":"$USER" /usr/local/lib/android
          mkdir -p /usr/local/lib/android/sdk

          cd /tmp

          # Android command line tools
          curl -fL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          mkdir -p /usr/local/lib/android/sdk/cmdline-tools
          unzip -q cmdline-tools.zip -d /usr/local/lib/android/sdk/cmdline-tools
          mv /usr/local/lib/android/sdk/cmdline-tools/cmdline-tools /usr/local/lib/android/sdk/cmdline-tools/latest
          rm -f cmdline-tools.zip

          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses
          sdkmanager --sdk_root=/usr/local/lib/android/sdk "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;27.3.13750724" "cmdline-tools;latest"

          ls -R /usr/local/lib/android/sdk

      - name: Install Python dependencies
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.36"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "virtualenv"

          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Build APK with Buildozer
        shell: bash
        run: |
          set -eux
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools:$PATH"
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724

          buildozer --version
          buildozer android clean || true
          buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            bin/*.apk
            bin/*/*.apk
